[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aexyron"
version = "0.1.0"
authors = [
  { name="Vasu Nandan", email="vasunandan2006@gmail.com" },
]
description = "An Autonomous, Digital-Twin-Driven Network Operations System with Counterfactual Resilience Analysis and a Replayable Black Box Recorder."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
